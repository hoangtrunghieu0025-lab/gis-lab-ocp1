<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <rect width="900" height="400" fill="#ffffff"/>
  <defs>
    <radialGradient id="g" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#f0f9ff"/><stop offset="1" stop-color="#93c5fd"/></radialGradient>
    <linearGradient id="cyl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde68a" stop-opacity="0.15"/><stop offset="0.5" stop-color="#fde68a" stop-opacity="0.55"/><stop offset="1" stop-color="#fde68a" stop-opacity="0.15"/></linearGradient>
    <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#111827"/></marker>
  </defs>
  <text x="20" y="30" font-size="17" font-weight="600">Transverse Mercator: ống trụ nằm ngang chạm Trái Đất dọc kinh tuyến trục</text>
  <!-- globe -->
  <circle cx="200" cy="220" r="130" fill="url(#g)" stroke="#1e3a8a" stroke-width="2"/>
  <!-- zone 48 strip -->
  <ellipse cx="200" cy="220" rx="30" ry="130" fill="#fca5a5" opacity="0.45" stroke="#dc2626" stroke-width="1"/>
  <line x1="200" y1="90" x2="200" y2="350" stroke="#dc2626" stroke-width="2.5"/>
  <!-- cylinder (horizontal, touching along central meridian) -->
  <rect x="60" y="88" width="280" height="264" fill="url(#cyl)" stroke="#b45309" stroke-width="1.5"/>
  <ellipse cx="60" cy="220" rx="18" ry="132" fill="none" stroke="#b45309" stroke-width="1.5"/>
  <ellipse cx="340" cy="220" rx="18" ry="132" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" opacity="0.6"/>
  <text x="85" y="380" font-size="12.5" fill="#92400e">ống trụ (trục nằm ngang)</text>
  <text x="208" y="80" font-size="12.5" fill="#dc2626" font-weight="600">105°E</text>
  <!-- arrow to unrolled -->
  <line x1="380" y1="220" x2="470" y2="220" stroke="#111827" stroke-width="2.5" marker-end="url(#m)"/>
  <text x="380" y="208" font-size="12.5">trải phẳng</text>
  <!-- unrolled zone plane -->
  <g transform="translate(500 70)">
    <path d="M60 0 L300 0 L330 300 L30 300 Z" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <line x1="180" y1="0" x2="180" y2="300" stroke="#dc2626" stroke-width="2.5"/>
    <text x="186" y="18" font-size="12" fill="#991b1b" font-weight="600">kinh tuyến trục 105°E</text>
    <text x="186" y="34" font-size="12" fill="#991b1b">E = 500 000 m, k₀ = 0,9996</text>
    <text x="10" y="296" font-size="12">102°E</text><text x="332" y="296" font-size="12">108°E</text>
    <line x1="0" y1="300" x2="370" y2="300" stroke="#16a34a" stroke-width="2"/>
    <text x="0" y="318" font-size="12" fill="#16a34a">xích đạo: N = 0</text>
    <!-- k bands -->
    <rect x="160" y="40" width="40" height="258" fill="#bbf7d0" opacity="0.6"/>
    <text x="120" y="160" font-size="11.5" fill="#166534">méo ít</text>
    <text x="50" y="120" font-size="11.5" fill="#991b1b">méo tăng</text><text x="270" y="120" font-size="11.5" fill="#991b1b">méo tăng</text>
    <!-- OCP1 -->
    <circle cx="212" cy="215" r="6" fill="#2563eb"/>
    <text x="222" y="212" font-size="12.5" fill="#1e40af" font-weight="600">OCP1</text>
    <text x="222" y="228" font-size="11.5" fill="#1e40af">E ≈ 598 144</text>
    <text x="222" y="243" font-size="11.5" fill="#1e40af">N ≈ 2 322 051</text>
  </g>
  <text x="20" y="398" font-size="12" fill="#6b7280">60 múi × 6° phủ kín Trái Đất. Múi 48 (102°E–108°E) chứa Hà Nội. Ra ngoài múi, độ méo vượt mức cho phép.</text>
</svg>
