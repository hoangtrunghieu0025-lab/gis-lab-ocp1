<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <rect width="820" height="340" fill="#ffffff"/>
  <text x="20" y="30" font-size="17" font-weight="600" fill="#111827">Ba bề mặt mô tả Trái Đất (mặt cắt, phóng đại theo chiều đứng)</text>
  <!-- ellipsoid -->
  <path d="M20 240 Q410 200 800 240" fill="none" stroke="#2563eb" stroke-width="3"/>
  <!-- geoid -->
  <path d="M20 232 C120 205 200 255 300 222 S470 190 560 232 S720 250 800 226" fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="8 5"/>
  <!-- terrain -->
  <path d="M20 250 L80 238 L130 160 L175 120 L215 165 L260 205 L330 214 L380 200 L430 225 L470 300 L520 300 L560 238 L620 212 L660 182 L700 196 L760 214 L800 222"
        fill="none" stroke="#92400e" stroke-width="3"/>
  <path d="M430 225 L470 300 L520 300 L560 238 Z" fill="#bfdbfe" opacity="0.6"/>
  <text x="455" y="290" font-size="12" fill="#1e40af">biển</text>
  <!-- point P on mountain -->
  <circle cx="175" cy="120" r="5" fill="#dc2626"/>
  <text x="185" y="112" fill="#dc2626" font-weight="600">P</text>
  <line x1="175" y1="120" x2="175" y2="222" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="168" y1="120" x2="168" y2="226" stroke="#111827" stroke-width="1" />
  <!-- h -->
  <line x1="150" y1="120" x2="150" y2="226" stroke="#2563eb" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="94" y="175" fill="#2563eb" font-weight="600">h</text>
  <text x="60" y="192" font-size="11" fill="#2563eb">(GPS đo)</text>
  <!-- H -->
  <line x1="198" y1="120" x2="198" y2="218" stroke="#16a34a" stroke-width="2" marker-end="url(#g)" marker-start="url(#g)"/>
  <text x="206" y="170" fill="#16a34a" font-weight="600">H</text>
  <text x="206" y="186" font-size="11" fill="#16a34a">(so với mực nước biển)</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2563eb"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#16a34a"/></marker>
  </defs>
  <!-- legend -->
  <g transform="translate(470 60)">
    <rect x="0" y="0" width="330" height="96" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <line x1="14" y1="22" x2="54" y2="22" stroke="#92400e" stroke-width="3"/><text x="64" y="27">Mặt đất thật: lồi lõm</text>
    <line x1="14" y1="48" x2="54" y2="48" stroke="#16a34a" stroke-width="3" stroke-dasharray="8 5"/><text x="64" y="53">Geoid: mặt nước biển trung bình</text>
    <line x1="14" y1="74" x2="54" y2="74" stroke="#2563eb" stroke-width="3"/><text x="64" y="79">Ellipsoid: mặt toán học trơn</text>
  </g>
  <text x="20" y="320" font-size="13" fill="#374151">h ≈ H + N  (N = độ cao geoid so với ellipsoid; ±100 m trên toàn cầu). Kinh độ, vĩ độ được đo trên ellipsoid.</text>
</svg>
