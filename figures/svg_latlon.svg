<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <rect width="860" height="400" fill="#ffffff"/>
  <defs>
    <radialGradient id="sea" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#eff6ff"/><stop offset="1" stop-color="#bfdbfe"/></radialGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#111827"/></marker>
  </defs>
  <!-- LEFT: latitude -->
  <text x="30" y="32" font-size="16" font-weight="600">Vĩ độ φ — lát cắt dọc qua hai cực</text>
  <circle cx="210" cy="215" r="145" fill="url(#sea)" stroke="#1e3a8a" stroke-width="2"/>
  <line x1="50" y1="215" x2="370" y2="215" stroke="#16a34a" stroke-width="2.5"/>
  <text x="300" y="207" fill="#16a34a" font-size="12">xích đạo 0°</text>
  <line x1="210" y1="50" x2="210" y2="380" stroke="#6b7280" stroke-dasharray="5 4"/>
  <text x="218" y="64" font-size="12">N  +90°</text><text x="218" y="376" font-size="12">S  −90°</text>
  <line x1="210" y1="215" x2="313" y2="113" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="313" cy="113" r="6" fill="#dc2626"/><text x="322" y="108" fill="#dc2626" font-weight="600">P (OCP1)</text>
  <path d="M265 215 A55 55 0 0 0 249 176" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="270" y="192" fill="#dc2626" font-weight="600">φ = 21°</text>
  <circle cx="210" cy="215" r="4" fill="#111827"/><text x="190" y="235" font-size="12">O</text>
  <!-- RIGHT: longitude, view from north pole -->
  <text x="460" y="32" font-size="16" font-weight="600">Kinh độ λ — nhìn từ cực Bắc xuống</text>
  <circle cx="645" cy="215" r="145" fill="url(#sea)" stroke="#1e3a8a" stroke-width="2"/>
  <line x1="645" y1="215" x2="645" y2="62" stroke="#16a34a" stroke-width="2.5"/>
  <text x="652" y="78" fill="#16a34a" font-size="12">Greenwich 0°</text>
  <line x1="645" y1="215" x2="805" y2="215" stroke="#6b7280" stroke-dasharray="5 4"/><text x="760" y="235" font-size="12">90°E</text>
  <line x1="645" y1="215" x2="485" y2="215" stroke="#6b7280" stroke-dasharray="5 4"/><text x="490" y="235" font-size="12">90°W</text>
  <line x1="645" y1="215" x2="645" y2="368" stroke="#6b7280" stroke-dasharray="5 4"/><text x="652" y="385" font-size="12">±180°</text>
  <!-- 105.94 deg clockwise from top (east) -->
  <line x1="645" y1="215" x2="784" y2="255" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="784" cy="255" r="6" fill="#dc2626"/><text x="740" y="282" fill="#dc2626" font-weight="600">P (OCP1)</text>
  <path d="M645 160 A55 55 0 0 1 698 230" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>
  <text x="690" y="170" fill="#dc2626" font-weight="600">λ = 105,94°E</text>
  <circle cx="645" cy="215" r="5" fill="#111827"/><text x="618" y="210" font-size="12">cực Bắc</text>
  <text x="30" y="395" font-size="12.5" fill="#374151">Vĩ độ chỉ cần nửa vòng (−90° … +90°), kinh độ cần trọn vòng (−180° … +180°) để mỗi điểm có đúng một cặp tọa độ.</text>
</svg>
