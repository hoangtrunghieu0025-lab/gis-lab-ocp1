<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <rect width="760" height="420" fill="#ffffff"/>
  <defs>
    <radialGradient id="g" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#f0f9ff"/><stop offset="1" stop-color="#93c5fd"/></radialGradient>
    <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#111827"/></marker>
  </defs>
  <text x="20" y="30" font-size="17" font-weight="600">Hệ địa tâm ECEF (EPSG:4978): ba trục X, Y, Z xuất phát từ tâm Trái Đất</text>
  <circle cx="300" cy="230" r="150" fill="url(#g)" stroke="#1e3a8a" stroke-width="2"/>
  <ellipse cx="300" cy="230" rx="150" ry="45" fill="none" stroke="#16a34a" stroke-width="2"/>
  <text x="440" y="285" fill="#16a34a" font-size="12">xích đạo (mặt phẳng XY)</text>
  <path d="M300 80 A55 150 0 0 0 300 380" fill="none" stroke="#6b7280" stroke-dasharray="5 4"/>
  <text x="208" y="120" font-size="12" fill="#6b7280">Greenwich</text>
  <!-- axes -->
  <line x1="300" y1="230" x2="300" y2="55" stroke="#111827" stroke-width="2.5" marker-end="url(#m)"/>
  <text x="310" y="62" font-weight="700">Z</text><text x="310" y="80" font-size="12">→ cực Bắc (trục quay)</text>
  <line x1="300" y1="230" x2="205" y2="320" stroke="#111827" stroke-width="2.5" marker-end="url(#m)"/>
  <text x="165" y="336" font-weight="700">X</text><text x="40" y="356" font-size="12">→ lat 0°, lon 0° (vịnh Guinea)</text>
  <line x1="300" y1="230" x2="485" y2="230" stroke="#111827" stroke-width="2.5" marker-end="url(#m)"/>
  <text x="492" y="235" font-weight="700">Y</text><text x="492" y="252" font-size="12">→ lat 0°, lon 90°E</text>
  <circle cx="300" cy="230" r="5" fill="#111827"/><text x="262" y="222" font-size="12">O (0,0,0)</text>
  <!-- OCP1 point (back-right, slightly north) -->
  <circle cx="433" cy="183" r="6" fill="#dc2626"/>
  <line x1="300" y1="230" x2="433" y2="183" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="442" y="178" fill="#dc2626" font-weight="600">OCP1</text>
  <g transform="translate(520 300)">
    <rect width="225" height="96" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="12" y="22" font-weight="600" fill="#991b1b">Đỉnh 1 tòa Sapphire S1.12</text>
    <text x="12" y="44" font-family="Consolas, monospace" font-size="13">X = −1 636 459 m</text>
    <text x="12" y="64" font-family="Consolas, monospace" font-size="13">Y = +5 728 026 m</text>
    <text x="12" y="84" font-family="Consolas, monospace" font-size="13">Z = +2 271 034 m</text>
  </g>
  <text x="20" y="410" font-size="12.5" fill="#374151">X âm vì cos(105,94°) &lt; 0 — OCP1 nằm “phía sau” trục Y so với Greenwich. Đông/Tây thể hiện qua dấu của Y.</text>
</svg>
